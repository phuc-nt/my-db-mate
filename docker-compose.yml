services:
  app-db:
    image: pgvector/pgvector:pg17
    container_name: mydbmate-app-db
    environment:
      POSTGRES_USER: mydbmate
      POSTGRES_PASSWORD: mydbmate
      POSTGRES_DB: mydbmate
    ports:
      - "5433:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydbmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Prebuilt image from CI; skip the local build with:
    #   docker compose --profile full pull && docker compose --profile full up
    # Plain `up` still builds from source when the image is absent locally.
    image: ghcr.io/phuc-nt/my-db-mate:latest
    build: .
    container_name: mydbmate-app
    depends_on:
      app-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mydbmate:mydbmate@app-db:5432/mydbmate
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.7-max}
      CREDENTIAL_ENC_KEY: ${CREDENTIAL_ENC_KEY}
    ports:
      - "3000:3000"
    volumes:
      # The one-click demo DB lives on the container filesystem (.demo/demo-shop.db)
      # while its connection row lives in Postgres. Without this volume, updating or
      # recreating the app container deletes the file but keeps the connection —
      # leaving a demo that fails every query. Persist it like the app DB.
      - app-demo-data:/app/.demo
    profiles: ["full"]  # `docker compose --profile full up` runs app+db; default runs db only

volumes:
  app-db-data:
  app-demo-data:
